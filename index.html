<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MSFS Razer RGB Controller</title>
</head>

<body>

    <h2>MSFS Razer RGB Controller</h2>

    <button onclick="setKeyColor('ESC', 'red')">
        ESC Red
    </button>

    <button onclick="setKeyColor('G', 'green')">
        G Green
    </button>

    <button onclick="setKeyColor('F', 'blue')">
        F Blue
    </button>

    <button onclick="clearAll()">
        Clear All
    </button>
    <button onclick="setKeyColor('ESC', 'red')">ESC Red</button>
<button onclick="setKeyColor('W', 'green')">W Green</button>
<button onclick="setKeyColor('A', 'green')">A Green</button>
<button onclick="setKeyColor('S', 'green')">S Green</button>
<button onclick="setKeyColor('D', 'green')">D Green</button>
<button onclick="clearAll()">Clear All</button>

    <p id="status">Connecting...</p>

    <script src="app.js"></script>

</body>
</html>
